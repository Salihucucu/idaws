# IDAWS Simulation Parameters
# Overrides for running with ArduPilot SITL + Gazebo

pymavlink_controller_node:
  ros__parameters:
    serial_port: "udp:127.0.0.1:14550"
    baud_rate: 115200
    system_id: 1
    component_id: 1

yolo_vision_node:
  ros__parameters:
    use_yolo: false
    model_path: ""
    confidence_threshold: 0.45
    record_dir: "/tmp/idaws_sim_recordings"
    input_width: 640
    input_height: 480
    # Simülasyonda kamera Gazebo'dan ros_gz_image köprüsüyle gelir.
    video_source: "ros"
    camera_topic: "/camera/image_raw"
    annotated_topic: "vision/image_annotated"
    publish_annotated: true

mission_manager_node:
  ros__parameters:
    json_serial_port: "/dev/null"
    json_baud_rate: 57600
    parkur1_timeout_sec: 300.0
    parkur2_timeout_sec: 300.0

collision_avoidance_node:
  ros__parameters:
    # safety_radius / danger_radius TABAN degerlerdir; uzerine anlik durma
    # mesafesi (v*reaction_time + v^2/(2*max_decel)) eklenir.
    safety_radius: 2.0
    danger_radius: 1.0
    reaction_time_sec: 1.0
    max_decel: 1.5
    max_safety_radius: 10.0      # LiDAR menzili 12 m — altinda kalmali
    # Hizi sensorun gorebildigi mesafeyle sinirla (durma mesafesi <= yaricap tavani)
    limit_speed_to_sensor_range: true
    speed_topic: "telemetry/groundspeed"
    max_speed: 1.0
    num_sectors: 72
    goal_weight: 1.0
    obstacle_weight: 2.0
    camera_fov_deg: 60.0

mission_logger_node:
  ros__parameters:
    log_dir: "/tmp/idaws_sim_logs"

lidar_logger_node:
  ros__parameters:
    scan_topic: "/scan"
    log_dir: "/tmp/idaws_sim_logs"
    record_hz: 1.0          # şartname: en az 1 Hz
    record_video: true
    render_size_px: 600
    # Kümeleme eşiği: gap_base + gap_factor * menzil (m)
    cluster_gap_base: 0.35
    cluster_gap_factor: 0.06
    cluster_min_points: 3
    max_cluster_range: 12.0
    # Lokal cost map (araç merkezli, base_link)
    map_size_m: 24.0
    map_resolution: 0.1
    inflation_radius: 0.8

web_ui_node:
  ros__parameters:
    web_port: 5000
    # Kamera ROS topic'inden okunur: YOLO açıksa çizimli akış, kapalıysa ham akış.
    video_source: "ros"
    camera_topic: "/camera/image_raw"
    annotated_topic: "vision/image_annotated"
    jpeg_quality: 70
    stream_fps: 15.0
    # LiDAR kuş bakışı görselleştirme
    scan_topic: "/scan"
    lidar_max_points: 360
    safety_radius: 2.0
    danger_radius: 1.0
