# IDAWS Docker imajı
#
# Bu workflow imajı derleyip GitHub Container Registry'ye (ghcr.io) yükler.
# Arkadaşlarınız sonrasında sadece `./run-docker.sh` çalıştırır.
#
# Kurulum (bir kez):
#   1. Repoyu GitHub'a push edin
#   2. Settings → Actions → General → Workflow permissions → "Read and write"
#   3. main'e push edin ya da Actions sekmesinden elle tetikleyin
#
# Yayınlanan imaj: ghcr.io/<kullanici>/<repo>:latest

name: docker-image

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'docker/**'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # ArduPilot derlemesi uzun sürüyor; runner'ın disk alanı yetmeyebiliyor.
      - name: Diskte yer aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Derle ve yükle
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Katman önbelleği: sadece src/ değiştiğinde ArduPilot yeniden derlenmez
          cache-from: type=gha
          cache-to: type=gha,mode=max
